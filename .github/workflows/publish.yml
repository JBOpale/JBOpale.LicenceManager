name: Publish JBOpale.LicenceManager

# Tag 'v*' (e.g. v1.0.0): build, test and publish the .NET package to nuget.org.
# Requires the repository secret NUGET_API_KEY (nuget.org API key scoped to JBOpale.*).

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore LicenceManager.sln

      - name: Build
        run: dotnet build LicenceManager.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LicenceManager.sln --configuration Release --no-build

      - name: Pack NuGet
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet pack LicenceManager/LicenceManager.csproj --configuration Release `
            -p:Version=$version --output nupkg

      - name: Publish to nuget.org
        shell: pwsh
        run: |
          dotnet nuget push nupkg\*.nupkg `
            --source "https://api.nuget.org/v3/index.json" `
            --api-key "${{ secrets.NUGET_API_KEY }}" `
            --skip-duplicate
