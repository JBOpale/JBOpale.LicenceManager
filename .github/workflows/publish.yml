name: Publish JBOpale.LicenceManager

# Tag 'v*' (e.g. v1.0.0): build, test and publish the .NET package to nuget.org.
# Trusted publishing (no stored API key): needs a nuget.org trusted publishing policy for this
# repository and this workflow file.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: [self-hosted, Windows, SURFACE-BOOK-3]
    permissions:
      contents: read
      id-token: write # OIDC token exchanged for a short-lived nuget.org API key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore LicenceManager.sln

      - name: Build
        run: dotnet build LicenceManager.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LicenceManager.sln --configuration Release --no-build

      - name: Pack NuGet
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet pack LicenceManager/LicenceManager.csproj --configuration Release `
            -p:Version=$version --output nupkg

      - name: NuGet login (OIDC, short-lived API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Kolth

      - name: Publish to nuget.org
        shell: pwsh
        run: |
          dotnet nuget push nupkg\*.nupkg `
            --source "https://api.nuget.org/v3/index.json" `
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
            --skip-duplicate
