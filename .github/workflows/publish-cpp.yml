name: Publish JBOpale.LicenceManager.Cpp

# Tag 'cpp-v*' (e.g. cpp-v1.0.0): build (Debug + Release, x64), test and publish the native
# NuGet package to nuget.org. Trusted publishing (no stored API key): needs a nuget.org trusted
# publishing policy for this repository and this workflow file, and the repository secret
# NUGET_USER (nuget.org profile name).
on:
  push:
    tags:
      - 'cpp-v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # OIDC token exchanged for a short-lived nuget.org API key
    defaults:
      run:
        shell: pwsh
        working-directory: LicenceManagerCpp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from tag
        id: version
        run: |
          $version = "${{ github.ref_name }}" -replace '^cpp-v', ''
          "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Locate MSBuild
        id: msbuild
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuildPath = & $vswhere -latest -prerelease -products * `
            -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuildPath) { throw "MSBuild not found (vswhere returned nothing)." }
          "MSBUILD_PATH=$msbuildPath" >> $env:GITHUB_OUTPUT

      - name: Build (Debug + Release, x64, v145)
        run: |
          & "${{ steps.msbuild.outputs.MSBUILD_PATH }}" LicenceManagerCpp.sln `
            /p:Configuration=Debug /p:Platform=x64 /p:PlatformToolset=v145 /m /nologo
          & "${{ steps.msbuild.outputs.MSBUILD_PATH }}" LicenceManagerCpp.sln `
            /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /m /nologo

      - name: Cross-check tests
        run: |
          .\bin\x64\Release\LicenceManagerCpp.Tests.exe
          if ($LASTEXITCODE -ne 0) { throw "Tests failed (exit $LASTEXITCODE)." }

      - name: Get nuget.exe
        id: nuget
        run: |
          $tool = Join-Path $env:RUNNER_TEMP "nuget.exe"
          if (-not (Test-Path $tool)) {
            Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $tool
          }
          "NUGET_EXE=$tool" >> $env:GITHUB_OUTPUT

      - name: Pack native NuGet
        run: |
          & "${{ steps.nuget.outputs.NUGET_EXE }}" pack LicenceManagerCpp.nuspec -Version "${{ steps.version.outputs.VERSION }}" -OutputDirectory nupkg

      - name: NuGet login (OIDC, short-lived API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: |
          dotnet nuget push nupkg\*.nupkg `
            --source "https://api.nuget.org/v3/index.json" `
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
            --skip-duplicate
